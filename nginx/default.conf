# ورودی واحد سایت؛ مسیر رسانه دقیقاً از volume مشترک backend خوانده می‌شود.
upstream iran_farda_frontend { server frontend:3000; }
upstream iran_farda_backend { server backend:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 120m;
    client_body_timeout 180s;
    send_timeout 180s;

    # فایل‌های رسانه از volume مشترک /app/media در بک‌اند ارائه می‌شوند.
    location /media/ {
        alias /var/www/media/;
        add_header X-Content-Type-Options nosniff;
        expires 7d;
        access_log off;
    }

    # فایل‌های استاتیک Django
    location /static/ { alias /var/www/static/; expires 30d; access_log off; }

    # درخواست‌های API و بارگذاری فایل
    location /api/ {
        proxy_pass http://iran_farda_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /admin/ {
        proxy_pass http://iran_farda_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ { proxy_pass http://iran_farda_backend; proxy_set_header Host $host; }

    # سایر صفحات به Next.js فرستاده می‌شوند.
    location / {
        proxy_pass http://iran_farda_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
    }
}
