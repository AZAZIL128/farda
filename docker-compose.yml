# اجرای محلی ایران فردا؛ بدون MinIO و بدون سرویس پشتیبان‌گیری
services:
  db:
    image: postgres:18.6-alpine
    container_name: iran-farda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iranfarda}
      POSTGRES_USER: ${POSTGRES_USER:-iranfarda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD در فایل .env تنظیم نشده است}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iranfarda} -d ${POSTGRES_DB:-iranfarda}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [iran-farda]

  redis:
    image: redis:8-alpine
    container_name: iran-farda-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [iran-farda]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iran-farda-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks: [iran-farda]

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iran-farda-celery
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    entrypoint: ["celery"]
    command: ["-A", "config", "worker", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks: [iran-farda]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iran-farda-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on: [backend]
    networks: [iran-farda]

  nginx:
    image: nginx:1.29-alpine
    container_name: iran-farda-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
    depends_on: [frontend, backend]
    networks: [iran-farda]

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

networks:
  iran-farda:
    driver: bridge
